<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
  <link rel="canonical" href="https://adrianemberley.ca/painting-i/">
  <title>Recent painting - Adrian Emberley</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f6fdfd; color: #272727; font: 16px/1.55 Inter, Arial, sans-serif; }
    a { color: inherit; }
    header { background: rgba(210,235,130,0.55); padding: 20px max(5vw, 24px); }
    .header-inner { max-width: 1280px; margin: auto; display: flex; justify-content: space-between; align-items: center; gap: 24px; }
    .brand { text-decoration: none; font-weight: 600; }
    nav { display: flex; flex-wrap: wrap; gap: 22px; }
    main { max-width: 1280px; margin: 0 auto; padding: 48px max(5vw, 24px); }
    .gallery { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; align-items: start; }
    figure { margin: 0; }
    figure img { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: contain; }
    figcaption { margin-top: 8px; text-align: left; }
    footer { border-top: 1px solid #d5dddd; padding: 28px max(5vw, 24px); text-align: center; font-size: .9rem; }
    @media (max-width: 640px) {
      .header-inner { align-items: flex-start; flex-direction: column; }
      .gallery { grid-template-columns: 1fr; gap: 20px; }
      figure.featured, .bottom-row, .bottom-row:nth-of-type(odd), .bottom-row:nth-of-type(even), .bottom-row.enlarged { width: 100%; margin-left: 0; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a class="brand" href="https://adrianemberley.ca/">Adrian Emberley</a>
      <nav aria-label="Main navigation">
        <a href="https://adrianemberley.ca/">Home</a>
        <a href="https://adrianemberley.ca/painting-i/" aria-current="page">Recent painting</a>
        <a href="https://adrianemberley.ca/painting-ii/">Watercolours</a>
        <a href="https://adrianemberley.ca/gardenimages/">Gardenimages</a>
        <a href="https://adrianemberley.ca/painting-iii/">Painting III</a>      
        <a href="https://adrianemberley.ca/about/">About</a>
        <a href="https://adrianemberley.ca/contact/">Contact</a>
      </nav>
    </div>
  </header>
  <main>
    <section class="gallery" aria-label="Recent painting gallery">
      <figure>
        <img fetchpriority="high" decoding="async" src="https://adrianemberley.ca/wp-content/uploads/2026/02/IMG_8188-3-775x1024.jpg" alt="Kailua Rd. O'ahu">
        <figcaption>Kailua Rd. O'ahu 2025 oil on canvas 36&quot; x 48&quot;</figcaption>
      </figure>
      <figure class="featured">
        <img loading="lazy" decoding="async" src="https://adrianemberley.ca/wp-content/uploads/2026/02/IMG_7905-2-972x1024.jpg" alt="">
      </figure>
      <figure>
        <img loading="lazy" decoding="async" src="https://adrianemberley.ca/wp-content/uploads/2026/02/IMG_6680-1-1024x733.jpg" alt="">
      </figure>
      <figure>
        <img loading="lazy" decoding="async" src="https://adrianemberley.ca/wp-content/uploads/2026/02/IMG_5827-948x1024.jpg" alt="">
      </figure>
      <figure class="bottom-row enlarged">
        <img loading="lazy" decoding="async" src="https://adrianemberley.ca/wp-content/uploads/2026/02/IMG_2741-858x1024.jpg" alt="">
      </figure>
      <figure class="bottom-row">
        <img loading="lazy" decoding="async" src="https://adrianemberley.ca/wp-content/uploads/2026/02/IMG_3698-1-825x1024.jpg" alt="">
      </figure>
      <figure>
        <img loading="lazy" decoding="async" src="https://adrianemberley.ca/wp-content/uploads/2026/03/IMG_0974-1.jpg" alt="">
        <figcaption>intersection 2023 oil on canvas 66&quot; x 76&quot;</figcaption>
      </figure>
    </section>
  </main>
  <footer>Designed with <a href="https://github.com/">GitHub</a></footer>
</body>
</html>
